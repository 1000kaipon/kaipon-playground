<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>1.2秒後の自分</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#0d1016;color:#eef2ff;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;touch-action:none}
.wrap{width:min(94vw,720px);padding:18px 12px 28px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.back{color:#9fd8ff;text-decoration:none;font-size:13px}
.status{font-size:12px;opacity:.7}
h1{margin:0 0 4px;font-size:clamp(24px,5vw,42px);letter-spacing:.08em}
.sub{opacity:.72;font-size:13px;margin-bottom:12px}
.hud{display:flex;justify-content:space-between;gap:8px;margin:8px 2px;font-size:14px}
.pill{background:#171d28;border:1px solid #2a3445;border-radius:999px;padding:7px 11px;flex:1}
canvas{width:100%;aspect-ratio:1/1;display:block;border:1px solid #303a4c;border-radius:14px;background:#111722;box-shadow:0 18px 60px rgba(0,0,0,.35)}
.queue{min-height:38px;margin:10px 0 6px;padding:8px 10px;border-radius:10px;background:#151b25;border:1px solid #263043;font-size:13px;text-align:left}
.queue b{color:#9fd8ff}
.controls{display:grid;grid-template-columns:repeat(3,74px);grid-template-rows:repeat(2,58px);gap:8px;justify-content:center;margin-top:12px}
button{border:1px solid #39465d;border-radius:12px;background:#1b2432;color:#fff;font-size:23px;font-weight:700;-webkit-tap-highlight-color:transparent}
button:active{transform:translateY(1px);background:#263246}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
.help{margin-top:12px;line-height:1.6;font-size:12px;opacity:.72}.accent{color:#9fd8ff}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../../">← Playground</a><span class="status" id="status">起動中…</span></div>
  <h1>1.2秒後の自分</h1>
  <div class="sub">押した方向へ動く。ただし、命令が届くのは1.2秒後。</div>
  <div class="hud">
    <div class="pill">SCORE <b id="score">0</b></div>
    <div class="pill">BEST <b id="best">0</b></div>
    <div class="pill">DELAY <b>1.2s</b></div>
  </div>
  <canvas id="game" width="660" height="660"></canvas>
  <div class="queue"><b>未来の命令：</b> <span id="queue">なし</span></div>
  <div class="controls">
    <button id="up" aria-label="上">↑</button>
    <button id="left" aria-label="左">←</button>
    <button id="down" aria-label="下">↓</button>
    <button id="right" aria-label="右">→</button>
  </div>
  <div class="help">PC: 矢印 / WASD　｜　スマホ: ボタン<br><span class="accent">青い欠片</span>を取る。赤い追跡者に触れたら終了。<br>考えるのは「今どこへ行くか」ではなく「1.2秒後にどこにいたいか」。</div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d'),scoreEl=$('score'),bestEl=$('best'),queueEl=$('queue'),statusEl=$('status');
statusEl.textContent='● READY';
const N=11,CELL=canvas.width/N,DELAY=1200,MOVE_COOLDOWN=110,ENEMY_STEP=430;
const dirs={up:{x:0,y:-1,s:'↑'},down:{x:0,y:1,s:'↓'},left:{x:-1,y:0,s:'←'},right:{x:1,y:0,s:'→'}};
let player,enemy,shard,queued,score,best=0,dead,lastMove,lastEnemy,flash=0;
try{best=+(localStorage.getItem('delay-best')||0)}catch(e){}
bestEl.textContent=best;
const clamp=v=>Math.max(0,Math.min(N-1,v));
function spawnShard(){do{shard={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while((shard.x===player.x&&shard.y===player.y)||(shard.x===enemy.x&&shard.y===enemy.y))}
function reset(){player={x:5,y:5};enemy={x:1,y:1};queued=[];score=0;dead=false;lastMove=0;lastEnemy=performance.now();flash=0;spawnShard();scoreEl.textContent=0;updateQueue()}
function enqueue(d){if(dead){reset();return}const now=performance.now();if(now-lastMove<MOVE_COOLDOWN)return;lastMove=now;queued.push({...dirs[d],at:now+DELAY});updateQueue()}
function updateQueue(){if(!queued.length){queueEl.textContent='なし';return}const now=performance.now();queueEl.textContent=queued.map(q=>q.s+Math.max(0,(q.at-now)/1000).toFixed(1)).join('  ')}
function stepPlayer(now){while(queued.length&&queued[0].at<=now){const q=queued.shift();player.x=clamp(player.x+q.x);player.y=clamp(player.y+q.y);if(player.x===shard.x&&player.y===shard.y){score++;scoreEl.textContent=score;flash=1;spawnShard();if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('delay-best',best)}catch(e){}}}}}
function stepEnemy(now){if(now-lastEnemy<ENEMY_STEP)return;lastEnemy=now;const dx=player.x-enemy.x,dy=player.y-enemy.y;if(Math.abs(dx)>Math.abs(dy))enemy.x+=Math.sign(dx);else if(dy!==0)enemy.y+=Math.sign(dy);else if(dx!==0)enemy.x+=Math.sign(dx)}
function checkDead(){if(player.x===enemy.x&&player.y===enemy.y){dead=true;queued=[];updateQueue()}}
function futurePath(){let x=player.x,y=player.y;return queued.map(q=>{x=clamp(x+q.x);y=clamp(y+q.y);return{x,y}})}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#101722';ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.strokeStyle='#1d2736';ctx.lineWidth=1;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(canvas.width,i*CELL);ctx.stroke()}
const path=futurePath();if(path.length){ctx.setLineDash([8,8]);ctx.strokeStyle='rgba(120,200,255,.45)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo((player.x+.5)*CELL,(player.y+.5)*CELL);path.forEach(p=>ctx.lineTo((p.x+.5)*CELL,(p.y+.5)*CELL));ctx.stroke();ctx.setLineDash([]);path.forEach((p,i)=>{ctx.fillStyle='rgba(120,200,255,'+Math.max(.12,.34-i*.03)+')';ctx.beginPath();ctx.arc((p.x+.5)*CELL,(p.y+.5)*CELL,CELL*.18,0,Math.PI*2);ctx.fill()})}
const sx=(shard.x+.5)*CELL,sy=(shard.y+.5)*CELL;ctx.save();ctx.translate(sx,sy);ctx.rotate(performance.now()/700);ctx.fillStyle='#7bdcff';ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?CELL*.14:CELL*.27,x=Math.cos(a)*r,y=Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.restore();
const ex=enemy.x*CELL+CELL*.18,ey=enemy.y*CELL+CELL*.18;ctx.fillStyle='#ff526b';rr(ex,ey,CELL*.64,CELL*.64,12);ctx.fill();
const px=player.x*CELL+CELL*.14,py=player.y*CELL+CELL*.14;ctx.fillStyle='#f5f7ff';rr(px,py,CELL*.72,CELL*.72,14);ctx.fill();
if(flash>0){ctx.fillStyle='rgba(123,220,255,'+(flash*.16)+')';ctx.fillRect(0,0,canvas.width,canvas.height);flash*=.88}
if(dead){ctx.fillStyle='rgba(6,9,14,.72)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='700 44px system-ui';ctx.fillText('未来が追いついた',canvas.width/2,canvas.height/2-12);ctx.font='20px system-ui';ctx.fillStyle='#cbd6e7';ctx.fillText('SCORE '+score+' — ボタンで再開',canvas.width/2,canvas.height/2+34)}
}
function loop(now){if(!dead){stepPlayer(now);stepEnemy(now);checkDead()}updateQueue();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowup'||k==='w'){e.preventDefault();enqueue('up')}if(k==='arrowdown'||k==='s'){e.preventDefault();enqueue('down')}if(k==='arrowleft'||k==='a'){e.preventDefault();enqueue('left')}if(k==='arrowright'||k==='d'){e.preventDefault();enqueue('right')}})
for(const d of ['up','down','left','right'])$(''+d).addEventListener('click',e=>{e.preventDefault();enqueue(d)});
reset();requestAnimationFrame(loop);
})()
</script>
</body>
</html>
