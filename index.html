<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaipon Playground</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#0d1016;color:#eef2ff;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}
main{width:min(92vw,860px);margin:0 auto;padding:42px 0 64px}
h1{font-size:clamp(30px,7vw,56px);margin:0 0 8px;letter-spacing:.04em}
.lead{opacity:.7;margin:0 0 34px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{display:block;color:inherit;text-decoration:none;background:#151b25;border:1px solid #2a3445;border-radius:18px;padding:22px;transition:.15s}
.card:hover{transform:translateY(-2px);border-color:#52647f}
.tag{font-size:12px;opacity:.6}.card h2{margin:8px 0 8px;font-size:24px}
.card p{margin:0;opacity:.75;line-height:1.65}
.play{display:inline-block;margin-top:18px;font-weight:800;color:#9fd8ff}
footer{margin-top:38px;font-size:12px;opacity:.48}
</style>
</head>
<body>
<main>
  <h1>Kaipon Playground</h1>
  <p class="lead">小さなWebゲームやインタラクティブ試作を、実際のブラウザで遊ぶためのランチャー。</p>
  <div class="grid">
    <a class="card" href="./games/1-2sec-later/">
      <div class="tag">MINI GAME / 2026-09-30</div>
      <h2>1.2秒後の自分</h2>
      <p>入力した方向へ動くのは1.2秒後。いまではなく「少し先の自分」を操作する、未来予約型のミニゲーム。</p>
      <span class="play">PLAY →</span>
    </a>
  </div>
  <footer>Hosted with GitHub Pages</footer>
</main>
</body>
</html>
